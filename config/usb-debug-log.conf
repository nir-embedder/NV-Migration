# Diagnostic overlay: verbose USB device stack / driver logging on UART0.
# Bench use only; not part of the server/client acceptance builds.
CONFIG_USBD_LOG_LEVEL_DBG=y
CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_DBG=y
CONFIG_USBD_CDC_ECM_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
